<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador</title>
    <link rel="stylesheet" href="css/estils.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <a href="index.html"><img src="img/TMDB.svg" alt="TMDB" height="25"></a>
        <nav>
            <ul>
                <li><a href="#">Buscador</a></li>
                <li><a href="contacte.html">Contacto</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <section class="buscador">
            <h1>BUSCA UNA PELICULA</h1>
            <p>Millones de titutlos, un solo buscador.</p>

            <div>
                <form method="get" action="https://www.themoviedb.org/search">
                    <input type="search" name="query" id="buscador"
                        placeholder="Busca una pelicula, por ejemplo: Cars 2">
                    <button>Buscar</button>
                </form>
            </div>

        </section>


        <section class="pelicules">

            <h2>Resultados</h2>

            <div class="resultats">
                <article class="targeta">
                    <img src="img/AngelesyDemonios.jpg" alt="Angeles y Demonios" height="400">
                    <h3>Angeles y Demonios</h3>
                    <p>2009</p>
                </article>

                <article class="targeta">
                    <img src="img/DBSB.jpg" alt="Dragon ball" height="400">
                    <h3>Dragon Ball Super Broly</h3>
                    <p>2019</p>
                </article>

                <article class="targeta">
                    <img src="img/RapidosyFuriosos.jpg" alt="Rapidos y Furiosos" height="400">
                    <h3>Rapidos y Furiosos X</h3>
                    <p>2023</p>
                </article>
            </div>

        </section>

    </main>

    <footer>
        <p> 2026 The Movie Database - Maqueta de diseño </p>
    </footer>

</body>

</html>
